name: macOS gates

# On-demand quality gate for macOS-only code (e.g. the objc2 calls in
# src/ui/theme.rs, behind #[cfg(target_os = "macos")]), which the Linux jobs
# in ci.yml never compile. Runs on pull requests targeting master and on
# manual trigger; it does not change when the existing CI runs, and unlike
# release.yml it builds, publishes and signs nothing, so it is safe to launch
# on any branch (T0076).

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: build + clippy + test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # --locked fails the job on Cargo.lock drift, as in ci.yml.
      - name: cargo build
        run: cargo build --locked

      - name: cargo clippy (-D warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # TEMPORARY diagnostic (T0076 -> T0089): run every test in its own
      # process so an AppKit abort only takes down that one test, and list
      # all failures at once. Replaced by a named skip list afterwards.
      - name: cargo test (diagnostic, each test isolated)
        run: |
          cargo test --locked --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.reason=="compiler-artifact" and .profile.test==true and .executable!=null) | .executable' > bins.txt
          : > summary.txt
          while read -r bin; do
            "$bin" --list --format=terse 2>/dev/null | sed -n 's/: test$//p' > names.txt
            echo "$(basename "$bin"): $(wc -l < names.txt) tests"
            while read -r t; do
              out=$("$bin" --exact "$t" 2>&1); rc=$?
              if [ $rc -ne 0 ]; then
                echo "::group::FAIL rc=$rc $(basename "$bin") :: $t"; echo "$out" | tail -40; echo "::endgroup::"
                echo "FAIL rc=$rc $(basename "$bin") :: $t" >> summary.txt
              fi
            done < names.txt
          done < bins.txt
          echo "==== SUMMARY"; cat summary.txt
          test ! -s summary.txt
