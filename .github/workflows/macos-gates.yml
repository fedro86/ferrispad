name: macOS gates

# On-demand quality gate for macOS-only code (e.g. the objc2 calls in
# src/ui/theme.rs, behind #[cfg(target_os = "macos")]), which the Linux jobs
# in ci.yml never compile. Runs on pull requests targeting master and on
# manual trigger; it does not change when the existing CI runs, and unlike
# release.yml it builds, publishes and signs nothing, so it is safe to launch
# on any branch (T0076).

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: build + clippy + test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # --locked fails the job on Cargo.lock drift, as in ci.yml.
      - name: cargo build
        run: cargo build --locked

      - name: cargo clippy (-D warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --locked
